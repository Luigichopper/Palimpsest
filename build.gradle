plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	mavenCentral()
	maven {
		name = "Nucleoid"
		url = "https://maven.nucleoid.xyz/"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"palimpsest" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "xyz.nucleoid:fantasy:${project.fantasy_version}"

	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.name}" }
	}
}

tasks.register('verifyNoSpoilers') {
	dependsOn processResources
	doLast {
		def secrets = []
		def seedFile = file("private/seed.txt")
		if (seedFile.exists()) {
			def s = seedFile.text.trim()
			if (!s.isEmpty()) secrets << s
		}
		def answersFile = file("private/answers.md")
		if (answersFile.exists()) {
			answersFile.readLines().each { line ->
				def trimmed = line.trim()
				if (trimmed.startsWith("|") && !trimmed.startsWith("| Puzzle ID") && !trimmed.startsWith("|---")) {
					def parts = trimmed.split("\\|")
					if (parts.length >= 4) {
						def ans = parts[3].trim()
						if (!ans.isEmpty()) secrets << ans
					}
				}
			}
		}

		if (!secrets.isEmpty()) {
			fileTree(processResources.destinationDir).each { f ->
				if (f.isFile() && !f.name.endsWith(".png")) {
					def text = f.text
					secrets.each { secret ->
						if (text.contains(secret)) {
							throw new GradleException("SPOILER HYGIENE FAILURE: Plaintext secret '${secret}' found in built resource ${f.path}")
						}
					}
				}
			}
		}
	}
}

check.dependsOn verifyNoSpoilers
